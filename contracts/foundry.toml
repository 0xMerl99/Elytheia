[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
# "paris" avoids PUSH0/MCOPY/transient-storage opcodes so the bytecode runs on any EVM chain.
evm_version = "paris"
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 512

[invariant]
runs = 64
depth = 64
fail_on_revert = false

# Uniswap v4 launchpad (src-v4/). Separate profile and output folders so the original launchpad's build is untouched.
# v4's PoolManager uses transient storage, so this profile compiles and tests for the "cancun" hard fork (Elysium runs it).
[profile.v4]
src = "src-v4"
test = "test-v4"
script = "script-v4"
out = "out-v4"
cache_path = "cache-v4"
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
  "v4-core/=lib/v4-core/src/",
  "solmate/=lib/v4-core/lib/solmate/",
]
